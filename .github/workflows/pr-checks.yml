name: PR checks

# Runs on pull requests, and docker-build.yml calls it before every deploy, so
# a push to main reaches GHCR and Coolify only after the same checks.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc -b
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # Builds the production image without pushing it, so a broken Dockerfile
  # fails here instead of in the deploy after the merge
  docker-build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: hegemony-companion:ci

      - name: Smoke test the image
        run: |
          docker run --detach --name smoke --publish 8080:80 hegemony-companion:ci
          for i in $(seq 1 30); do
            if curl --silent --fail --output page.html http://localhost:8080/; then
              echo "Container answered on attempt ${i}"
              grep --quiet '<title>Hegemony Companion</title>' page.html
              exit 0
            fi
            sleep 2
          done
          exit 1

      # Browser test against the same running container: every screen in
      # e2e/routes.json must render from the bundle without a JavaScript error
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser test the image
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke || true
          docker rm --force smoke || true
